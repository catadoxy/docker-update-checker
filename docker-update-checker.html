<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Update Checker</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        try {
            document.documentElement.setAttribute(
                'data-theme',
                localStorage.getItem('docker-update-checker-theme') || 'cyberpunk'
            );
        } catch (e) { /* storage unavailable */ }
    </script>
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff41;
            --neon-orange: #ff6b00;
            --dark-bg: #0a0e27;
            --darker-bg: #050816;
            --card-bg: rgba(15, 23, 42, 0.8);
            --border-color: rgba(0, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--darker-bg);
            color: var(--neon-cyan);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Scanline effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 255, 0.02) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        #root {
            position: relative;
            z-index: 2;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .title {
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
            animation: glitch 3s infinite;
            letter-spacing: 4px;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-2px, -2px); }
        }

        .subtitle {
            font-size: 0.9rem;
            color: rgba(0, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: 2px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--neon-cyan);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .btn:hover {
            color: var(--darker-bg);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .btn:hover::before {
            left: 0;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-refresh {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .btn-refresh::before {
            background: var(--neon-green);
        }

        .btn-refresh:hover {
            box-shadow: 0 0 20px var(--neon-green);
        }

        .theme-switcher {
            display: inline-flex;
            border: 2px solid var(--neon-pink);
        }

        .theme-btn {
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--neon-pink);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-btn + .theme-btn {
            border-left: 1px solid var(--border-color);
        }

        .theme-btn:hover {
            box-shadow: inset 0 0 20px rgba(255, 0, 255, 0.15);
        }

        .theme-btn.active {
            background: var(--neon-pink);
            color: var(--darker-bg);
        }

        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .stat-total .stat-value { color: var(--neon-cyan); }
        .stat-updates .stat-value { color: var(--neon-orange); animation: pulse 2s infinite; }
        .stat-current .stat-value { color: var(--neon-green); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .section-title-updates {
            color: var(--neon-orange);
            border-bottom: 2px solid var(--neon-orange);
            margin-top: 20px;
        }

        .section-title-current {
            color: var(--neon-green);
            border-bottom: 2px solid var(--neon-green);
            margin-top: 40px;
        }

        .container-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .container-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 25px;
            position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: cardAppear 0.5s ease backwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.2);
        }

        .container-card.has-update {
            border-color: var(--neon-orange);
            animation: borderGlow 2s infinite;
        }

        @keyframes borderGlow {
            0%, 100% {
                border-color: var(--neon-orange);
                box-shadow: 0 0 20px rgba(255, 107, 0, 0.3);
            }
            50% {
                border-color: var(--neon-pink);
                box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
            }
        }

        .container-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            gap: 10px;
        }

        .container-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-cyan);
            word-break: break-word;
            flex: 1;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 2px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .status-running {
            background: rgba(0, 255, 65, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .status-update {
            background: rgba(255, 107, 0, 0.2);
            color: var(--neon-orange);
            border: 1px solid var(--neon-orange);
            animation: pulse 2s infinite;
        }

        .container-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
        }

        .info-row {
            display: flex;
            gap: 10px;
            align-items: start;
        }

        .info-label {
            color: rgba(0, 255, 255, 0.5);
            min-width: 90px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .info-value {
            color: rgba(0, 255, 255, 0.9);
            word-break: break-all;
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
        }

        .version-badge {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .version-badge-latest {
            border-color: var(--neon-orange);
            background: rgba(255, 107, 0, 0.1);
        }

        .bump-major {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .bump-minor,
        .bump-patch,
        .bump-digest {
            border-color: var(--neon-orange);
            color: var(--neon-orange);
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid rgba(255, 0, 0, 0.5);
            padding: 30px;
            text-align: center;
            color: #ff4444;
            margin: 20px 0;
        }

        .error-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .error-hint {
            margin-top: 15px;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(0, 255, 255, 0.5);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state-hint {
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .docker-endpoint {
            font-size: 0.75rem;
            color: rgba(0, 255, 255, 0.5);
            text-align: center;
            margin-top: 10px;
        }

        .endpoint-status.disabled {
            color: rgba(255, 107, 0, 0.8);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }

            .container-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }
        }

        /* ─── Light ("non-cyberpunk") theme ─────────────────────────────────── */
        :root[data-theme="light"] {
            --neon-cyan: #0e7490;
            --neon-pink: #a21caf;
            --neon-green: #15803d;
            --neon-orange: #c2410c;
            --dark-bg: #e2e8f0;
            --darker-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(14, 116, 144, 0.3);
        }

        :root[data-theme="light"] body {
            color: #0f172a;
        }

        :root[data-theme="light"] body::before {
            background-image:
                linear-gradient(rgba(14, 116, 144, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 116, 144, 0.06) 1px, transparent 1px);
        }

        :root[data-theme="light"] body::after {
            display: none;
        }

        :root[data-theme="light"] .title {
            text-shadow: none;
            animation: none;
        }

        :root[data-theme="light"] .subtitle {
            color: rgba(15, 23, 42, 0.6);
        }

        :root[data-theme="light"] .info-label {
            color: rgba(15, 23, 42, 0.55);
        }

        :root[data-theme="light"] .info-value {
            color: #0f172a;
        }

        :root[data-theme="light"] .empty-state,
        :root[data-theme="light"] .docker-endpoint {
            color: rgba(15, 23, 42, 0.55);
        }

        :root[data-theme="light"] .error {
            color: #b91c1c;
        }

        :root[data-theme="light"] .status-bar {
            box-shadow: 0 0 30px rgba(14, 116, 144, 0.08);
        }

        :root[data-theme="light"] .container-card {
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        }

        :root[data-theme="light"] .container-card:hover {
            box-shadow: 0 10px 40px rgba(14, 116, 144, 0.15);
        }

        /* ─── Dark theme ────────────────────────────────────────────────────── */
        :root[data-theme="dark"] {
            --neon-cyan: #38bdf8;
            --neon-pink: #f472b6;
            --neon-green: #22c55e;
            --neon-orange: #fb923c;
            --dark-bg: #0f172a;
            --darker-bg: #0b1220;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-color: rgba(148, 163, 184, 0.25);
        }

        :root[data-theme="dark"] body {
            color: #e2e8f0;
        }

        :root[data-theme="dark"] body::before {
            opacity: 0.35;
        }

        :root[data-theme="dark"] body::after {
            display: none;
        }

        :root[data-theme="dark"] .title {
            text-shadow: none;
            animation: none;
        }

        :root[data-theme="dark"] .subtitle {
            color: rgba(226, 232, 240, 0.6);
        }

        :root[data-theme="dark"] .info-label {
            color: rgba(226, 232, 240, 0.55);
        }

        :root[data-theme="dark"] .info-value {
            color: #e2e8f0;
        }

        :root[data-theme="dark"] .empty-state,
        :root[data-theme="dark"] .docker-endpoint {
            color: rgba(226, 232, 240, 0.55);
        }

        :root[data-theme="dark"] .status-bar,
        :root[data-theme="dark"] .container-card {
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="/app.js" defer></script>
</body>
</html>
