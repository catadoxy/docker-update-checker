<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <meta name="color-scheme" content="dark light">
    <title>Docker Update Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        try {
            document.documentElement.setAttribute(
                'data-theme',
                localStorage.getItem('docker-update-checker-theme') || 'dark'
            );
        } catch (e) { /* storage unavailable */ }
    </script>
    <style>
        /* ─── Design tokens ─────────────────────────────────────────────────── */
        :root {
            color-scheme: dark;
            --bg: #0b0f19;
            --surface: #111726;
            --surface-2: #0f1420;
            --border: #1e2637;
            --border-strong: #2b374b;
            --ink: #e6eaf2;
            --ink-2: #b3bccd;
            --muted: #8b97ac;
            --accent: #7c8cf8;
            --accent-ink: #0b0f19;
            --accent-soft: rgba(124, 140, 248, 0.14);
            --update: #f7b955;
            --update-soft: rgba(247, 185, 85, 0.12);
            --update-border: rgba(247, 185, 85, 0.32);
            --ok: #52d19a;
            --ok-soft: rgba(82, 209, 154, 0.12);
            --ok-border: rgba(82, 209, 154, 0.3);
            --danger: #f87575;
            --danger-soft: rgba(248, 117, 117, 0.12);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            --radius: 12px;
            --radius-sm: 8px;
            --maxw: 1200px;
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-2: #f4f6fa;
            --border: #e3e8ef;
            --border-strong: #cdd5e0;
            --ink: #101828;
            --ink-2: #344054;
            --muted: #667085;
            --accent: #4f46e5;
            --accent-ink: #ffffff;
            --accent-soft: #eef0ff;
            --update: #b54708;
            --update-soft: #fff7e6;
            --update-border: #f0d49b;
            --ok: #087443;
            --ok-soft: #e9f9f0;
            --ok-border: #b7e4c9;
            --danger: #b42318;
            --danger-soft: #fef3f2;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.04);
        }

        :root[data-theme="cyberpunk"] {
            color-scheme: dark;
            --bg: #04070f;
            --surface: #0a1020;
            --surface-2: #070c17;
            --border: #1b2b4d;
            --border-strong: #2c4a80;
            --ink: #e2edff;
            --ink-2: #a6c2e8;
            --muted: #6f8cba;
            --accent: #22e0ff;
            --accent-ink: #03121a;
            --accent-soft: rgba(34, 224, 255, 0.14);
            --accent-2: #ff2bd6;
            --accent-2-soft: rgba(255, 43, 214, 0.14);
            --update: #ffb020;
            --update-soft: rgba(255, 176, 32, 0.14);
            --update-border: rgba(255, 176, 32, 0.45);
            --ok: #2ff0a8;
            --ok-soft: rgba(47, 240, 168, 0.12);
            --ok-border: rgba(47, 240, 168, 0.34);
            --danger: #ff5470;
            --danger-soft: rgba(255, 84, 112, 0.14);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        /* ─── Base ──────────────────────────────────────────────────────────── */
        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0;
        }

        button {
            font: inherit;
            color: inherit;
            touch-action: manipulation;
        }

        input {
            font: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .skip {
            position: absolute;
            left: 12px;
            top: -48px;
            z-index: 20;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--ink);
            text-decoration: none;
            transition: top 0.15s ease;
        }

        .skip:focus {
            top: 12px;
        }

        .shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        /* Neon grid, cyberpunk theme only */
        :root[data-theme="cyberpunk"] body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(34, 224, 255, 0.09) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 224, 255, 0.09) 1px, transparent 1px),
                linear-gradient(rgba(255, 43, 214, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 43, 214, 0.06) 1px, transparent 1px);
            background-size: 44px 44px, 44px 44px, 88px 88px, 88px 88px;
            -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 78%);
            mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 78%);
        }

        /* ─── App bar ───────────────────────────────────────────────────────── */
        .appbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .appbar-inner {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: none;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .brand-name {
            font-size: 15px;
            line-height: 1.2;
        }

        .brand-sub {
            display: block;
            font-size: 12px;
            color: var(--muted);
        }

        .appbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .scan-meta {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* ─── Controls ──────────────────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 15px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--ink);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, filter 0.15s ease;
        }

        .btn:hover {
            border-color: var(--accent);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }

        .btn-primary:hover {
            filter: brightness(1.08);
            border-color: var(--accent);
        }

        .segmented {
            display: inline-flex;
            gap: 2px;
            padding: 2px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .seg-btn {
            height: 30px;
            padding: 0 10px;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .seg-btn:hover {
            color: var(--ink);
        }

        .seg-btn[aria-pressed="true"] {
            background: var(--surface);
            color: var(--ink);
            box-shadow: var(--shadow);
        }

        /* ─── Layout ────────────────────────────────────────────────────────── */
        .main {
            max-width: var(--maxw);
            margin: 0 auto;
            width: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 16px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .stat-num {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
        }

        .stat-updates {
            background: var(--update-soft);
            border-color: var(--update-border);
        }

        .stat-updates .stat-num {
            color: var(--update);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
            max-width: 360px;
        }

        .search svg {
            position: absolute;
            left: 11px;
            color: var(--muted);
            pointer-events: none;
        }

        .search input {
            width: 100%;
            height: 38px;
            padding: 0 12px 0 34px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
            font-size: 13px;
        }

        .search input::placeholder {
            color: var(--muted);
        }

        .toolbar-count {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-head {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title {
            font-size: 14px;
            color: var(--ink-2);
            text-wrap: balance;
        }

        .section-count {
            display: inline-grid;
            place-items: center;
            min-width: 22px;
            height: 20px;
            padding: 0 7px;
            border-radius: 999px;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .section-updates .section-title {
            color: var(--update);
        }

        .section-updates .section-count {
            background: var(--update-soft);
            border-color: var(--update-border);
            color: var(--update);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }

        /* ─── Cards ─────────────────────────────────────────────────────────── */
        .card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow);
        }

        .card-update {
            border-color: var(--update-border);
            background: linear-gradient(90deg, var(--update-soft), var(--surface) 60%);
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .card-name {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: none;
            height: 22px;
            padding: 0 9px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .pill-update {
            color: var(--update);
            background: var(--update-soft);
            border-color: var(--update-border);
        }

        .pill-ok {
            color: var(--ok);
            background: var(--ok-soft);
            border-color: var(--ok-border);
        }

        .meta {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin: 0;
        }

        .row {
            display: grid;
            grid-template-columns: 62px 1fr;
            gap: 10px;
            align-items: baseline;
            font-size: 12.5px;
        }

        .row dt {
            color: var(--muted);
        }

        .row dd {
            margin: 0;
            color: var(--ink-2);
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .mono {
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .versions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ver {
            padding: 2px 7px;
            border-radius: 6px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--ink-2);
        }

        .ver-new {
            color: var(--update);
            background: var(--update-soft);
            border-color: var(--update-border);
        }

        .arrow {
            color: var(--muted);
        }

        .chip {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            color: var(--update);
            background: var(--update-soft);
            border: 1px solid var(--update-border);
        }

        /* ─── States ────────────────────────────────────────────────────────── */
        .state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 40px 24px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .state-title {
            font-size: 15px;
            font-weight: 600;
        }

        .state-text {
            font-size: 13px;
            color: var(--muted);
            max-width: 60ch;
            text-wrap: pretty;
        }

        .state-hint {
            font-size: 12.5px;
            color: var(--muted);
            max-width: 60ch;
            text-wrap: pretty;
        }

        .state-emoji {
            font-size: 28px;
            line-height: 1;
        }

        .state-error {
            border-color: var(--danger);
        }

        .state-error .state-title {
            color: var(--danger);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border-strong);
            border-top-color: var(--accent);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ─── Cyberpunk neon accents ────────────────────────────────────────── */
        :root[data-theme="cyberpunk"] .mark {
            background: linear-gradient(135deg, rgba(34, 224, 255, 0.2), rgba(255, 43, 214, 0.2));
            color: var(--accent);
            box-shadow: 0 0 0 1px rgba(34, 224, 255, 0.4), 0 0 18px rgba(34, 224, 255, 0.35);
        }

        :root[data-theme="cyberpunk"] .brand-name {
            text-shadow: 0 0 14px rgba(34, 224, 255, 0.5);
        }

        :root[data-theme="cyberpunk"] .appbar {
            border-bottom-color: rgba(34, 224, 255, 0.35);
            box-shadow: 0 1px 0 rgba(34, 224, 255, 0.12), 0 12px 30px -22px rgba(34, 224, 255, 0.7);
        }

        :root[data-theme="cyberpunk"] .btn-primary {
            box-shadow: 0 0 18px rgba(34, 224, 255, 0.4);
        }

        :root[data-theme="cyberpunk"] .btn-primary:hover {
            box-shadow: 0 0 24px rgba(34, 224, 255, 0.6);
        }

        :root[data-theme="cyberpunk"] .seg-btn[aria-pressed="true"] {
            color: var(--accent);
            box-shadow: 0 0 0 1px rgba(255, 43, 214, 0.5), 0 0 14px rgba(255, 43, 214, 0.35);
        }

        :root[data-theme="cyberpunk"] .section-updates .section-title {
            text-shadow: 0 0 12px rgba(255, 176, 32, 0.45);
        }

        :root[data-theme="cyberpunk"] .card-update {
            border-color: var(--update-border);
            box-shadow: inset 3px 0 0 var(--update), 0 0 0 1px rgba(255, 43, 214, 0.16);
        }

        :root[data-theme="cyberpunk"] .pill-update {
            box-shadow: 0 0 12px rgba(255, 176, 32, 0.3);
        }

        :root[data-theme="cyberpunk"] .pill-ok {
            box-shadow: 0 0 12px rgba(47, 240, 168, 0.25);
        }

        /* ─── Responsive ────────────────────────────────────────────────────── */
        @media (max-width: 720px) {
            .appbar-inner,
            .main {
                padding-left: 16px;
                padding-right: 16px;
            }

            .brand-sub {
                display: none;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .scan-meta {
                order: 3;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .stat {
                padding: 12px;
            }

            .stat-num {
                font-size: 22px;
            }

            .row {
                grid-template-columns: 52px 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="/app.js" defer></script>
</body>
</html>
