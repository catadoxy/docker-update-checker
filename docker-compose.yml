services:
  docker-update-checker:
    # Pull the published image, or comment this out and use `build: .` instead
    image: ghcr.io/catadoxy/docker-update-checker:latest
    container_name: docker-update-checker
    ports:
      - "3456:3456"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Check interval in seconds (default: 300 = 5 minutes)
      # Set to 0 to disable auto-refresh (manual refresh only)
      # Minimum recommended: 60 seconds to avoid overwhelming Docker Hub API
      - CHECK_INTERVAL=0
      # ── Notifications (optional) ─────────────────────────────────────────
      # Background scans send notifications when new updates appear.
      # Requires CHECK_INTERVAL > 0 (any of these channels enables it):
      # - NTFY_URL=https://ntfy.sh/your-topic
      # - NTFY_TOKEN=tk_xxxxxxxxxxxx
      # - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
      # - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/...
      # - NOTIFY_WEBHOOK_URL=https://example.com/hooks/docker-updates
